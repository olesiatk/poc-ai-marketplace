@if (loadError(); as error) {
  <div [class.min-h-screen]="!embedded" class="flex items-center justify-center text-body text-sm p-8 text-center">
    Failed to load the catalog: {{ error }}
  </div>
} @else {
  <div [class.min-h-screen]="!embedded">
    <main>
      <app-hero
        [(value)]="searchValue"
        [isSearching]="isSearching()"
        [statusMessage]="statusMessage()"
        [vocabulary]="searchVocabulary()"
        [presets]="presets"
        [activeQuery]="query()"
        (submitQuery)="onSearch($event)"
        (pickPreset)="runQuery($event)"
        (clearQuery)="onClearQuery()"
        (howItWorks)="startTour()"
        (searchFocus)="warmUpSearch()"
      />
      <app-filters-bar
        [options]="filterOptions()"
        [filters]="filters()"
        [priceLimit]="priceLimit()"
        [fromQuery]="filtersFromQuery()"
        (filterChange)="onFilterChange($event)"
        (reset)="onResetFilters()"
      />
      @if (query()) {
        <app-search-comparison
          [query]="query()"
          [keywordProducts]="keywordProducts()"
          [aiProducts]="aiProducts()"
          [keywordMatches]="keywordMatches()"
          [aiMatches]="aiMatches()"
          [rankChanges]="rankChanges()"
          [queryWordCount]="queryWordCount()"
          [keywordAllWordsCount]="keywordAllWordsCount()"
          [aiLoading]="isSearching()"
          [aiLoadingText]="aiLoadingText()"
          [aiNote]="aiNote()"
          (select)="onSelect($event.id, $event.side)"
          (clearQuery)="onClearQuery()"
        />
      } @else {
        <app-product-grid
          [products]="browseProducts()"
          [matches]="aiMatches()"
          [query]="query()"
          [isSearching]="isSearching()"
          (select)="onSelect($event)"
          (clearQuery)="onClearQuery()"
        />
      }
    </main>
    @if (selectedProduct(); as product) {
      <app-product-modal
        [product]="product"
        [reviews]="reviews()"
        [matchInfo]="selectedMatchInfo()"
        (close)="selected.set(null)"
      />
    }
  </div>
}
