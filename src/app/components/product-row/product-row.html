<button
  type="button"
  (click)="select.emit(product().id)"
  (mouseenter)="hoverChange.emit(product().id)"
  (mouseleave)="hoverChange.emit(null)"
  (focus)="hoverChange.emit(product().id)"
  (blur)="hoverChange.emit(null)"
  class="product-card interactive"
  [class.product-card--ai]="aiSide()"
  [class.product-card--ai-only]="aiSide() && rankBadge()?.tone === 'new'"
  [class.product-card--paired]="paired()"
>
  <span class="flex-none w-24 h-24 box-border bg-white border border-line-disabled flex items-center justify-center p-1">
    @if (imageUrl() && !imageFailed()) {
      <img
        [src]="imageUrl()"
        [alt]="product().title"
        loading="lazy"
        decoding="async"
        (error)="imageFailed.set(true)"
        class="max-w-full max-h-full object-contain"
      />
    } @else {
      <span class="text-xs text-muted text-center">No image</span>
    }
  </span>
  <span class="flex-1 min-w-0 flex flex-col gap-1.5">
    @if (rankBadge(); as badge) {
      <span
        class="tag"
        [class.tag-ai]="badge.tone === 'new'"
        [class.tag-dark]="badge.tone === 'off'"
        [class.tag-up]="badge.tone === 'up'"
        [class.tag-outline]="badge.tone === 'down' || badge.tone === 'same'"
        [title]="badge.title"
      >
        @if (badge.tone === "new") {
          <app-icon name="check" [size]="13" />
        } @else if (badge.tone === "off") {
          <app-icon name="close" [size]="13" />
        }
        {{ badge.text }}
      </span>
    }
    <span class="text-[17px] font-semibold leading-[1.3] line-clamp-2" [title]="product().title">{{ product().title }}</span>
    <span class="text-[15px] text-muted truncate">{{ product().store }}</span>
    @if (reason(); as why) {
      <span class="text-[15px] leading-[1.35] text-body line-clamp-2">
        {{ why.label }}
        @if (why.terms.length) {
          <strong>
            @for (term of why.terms; track term; let last = $last) {
              “{{ term }}”{{ last ? "" : ", " }}
            }
          </strong>
        }
      </span>
    }
    <span class="mt-auto pt-1 flex items-center justify-between gap-2">
      <span class="text-xl font-bold">{{ formatPrice(product().price) }}</span>
      <span class="flex items-center gap-1.5 text-[15px] text-body whitespace-nowrap">
        <span class="text-green flex"><app-icon name="star" [size]="16" /></span>
        <strong class="text-ink">{{ formatRating(product().averageRating) }}</strong>
        ({{ reviewCount() }})
      </span>
    </span>
  </span>
</button>
