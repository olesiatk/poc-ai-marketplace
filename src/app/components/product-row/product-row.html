<button
  type="button"
  (click)="select.emit(product().id)"
  (mouseenter)="hoverChange.emit(product().id)"
  (mouseleave)="hoverChange.emit(null)"
  (focus)="hoverChange.emit(product().id)"
  (blur)="hoverChange.emit(null)"
  [class.is-paired]="paired()"
  [class.is-ai-only]="rankBadge()?.tone === 'new'"
  [class.is-ai-tint]="aiTint()"
  [class.is-dimmed]="dimmed()"
  class="product-tile bg-surface w-full h-full flex items-stretch gap-2.5 p-2 text-left cursor-pointer border border-transparent hover:[border-image:var(--gradient-brand)_1] transition-colors"
>
  <span class="relative shrink-0 w-16 bg-white flex items-center justify-center p-1">
    @if (imageUrl() && !imageFailed()) {
      <img
        [src]="imageUrl()"
        [alt]="product().title"
        loading="lazy"
        decoding="async"
        (error)="imageFailed.set(true)"
        class="max-h-16 max-w-full object-contain"
      />
    } @else {
      <span class="text-[9px] text-body text-center">No image</span>
    }
    @if (rank(); as r) {
      <span class="rank-number absolute top-0 left-0">{{ r }}</span>
    }
  </span>
  <span class="flex-1 min-w-0 flex flex-col">
    @if (rankBadge(); as badge) {
      <span class="rank-badge rank-badge--{{ badge.tone }} self-start mb-1" [title]="badge.title">{{ badge.text }}</span>
    }
    <span class="text-[11px] font-extrabold leading-snug line-clamp-2" [title]="product().title">{{ product().title }}</span>
    @if (reason(); as why) {
      <span class="block text-[10px] text-brand-dark font-semibold truncate mt-0.5" [title]="why">{{ why }}</span>
    }
    <span class="dim-target flex items-center justify-between gap-2 mt-auto pt-1 text-[11px]">
      <span class="font-extrabold text-ink">{{ formatPrice(product().price) }}</span>
      <span class="flex items-center gap-0.5 font-bold text-body whitespace-nowrap">
        <app-icon name="star" [size]="11" class="text-brand-dark" />
        {{ formatRating(product().averageRating) }} · {{ product().ratingCount }}
      </span>
    </span>
  </span>
</button>
