@switch (name()) {
  @case ("mic") {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [attr.width]="size()" [attr.height]="size()" aria-hidden="true">
      <rect x="9" y="2" width="6" height="12" rx="3" />
      <path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4" />
    </svg>
  }
  @case ("search") {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" [attr.width]="size()" [attr.height]="size()" aria-hidden="true">
      <path d="M21 21L16.65 16.65M11 6C13.7614 6 16 8.23858 16 11M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z" />
    </svg>
  }
  @case ("close") {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" [attr.width]="size()" [attr.height]="size()" aria-hidden="true">
      <path d="M18 6 6 18M6 6l12 12" />
    </svg>
  }
  @case ("check") {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" [attr.width]="size()" [attr.height]="size()" aria-hidden="true">
      <path d="M20 6 9 17l-5-5" />
    </svg>
  }
  @case ("star") {
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" [attr.width]="size()" [attr.height]="size()" aria-hidden="true">
      <path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z" />
    </svg>
  }
  @case ("chevron-down") {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" [attr.width]="size()" [attr.height]="size()" aria-hidden="true">
      <path d="M6 10L12 16L18 10" />
    </svg>
  }
  @case ("arrow-right") {
    <svg viewBox="0 0 24 24" fill="currentColor" [attr.width]="size()" [attr.height]="size()" aria-hidden="true">
      <path d="M16.0445 10.9628L4 10.9628L4 13.0643L16.0356 13.0643L12.6346 16.5149L14.1017 18L20 12.0156L14.1038 6L12.6326 7.481L16.0445 10.9628Z" />
    </svg>
  }
  @case ("arrow-left") {
    <svg viewBox="0 0 24 24" fill="currentColor" [attr.width]="size()" [attr.height]="size()" aria-hidden="true" style="transform: scaleX(-1)">
      <path d="M16.0445 10.9628L4 10.9628L4 13.0643L16.0356 13.0643L12.6346 16.5149L14.1017 18L20 12.0156L14.1038 6L12.6326 7.481L16.0445 10.9628Z" />
    </svg>
  }
  @case ("filter") {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" [attr.width]="size()" [attr.height]="size()" aria-hidden="true">
      <path d="M4 6h16M7 12h10M10 18h4" />
    </svg>
  }
}
