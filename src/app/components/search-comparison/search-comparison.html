<section class="flex flex-col gap-6" data-tour="comparison">
  @if (summary().length || aiNote()) {
    <div class="flex flex-wrap items-center justify-between gap-x-6 gap-y-2 p-4 bg-ai-surface border-l-4 border-green">
      <p class="flex-[1_1_320px] min-w-0 text-[19px] leading-[1.3]" aria-live="polite">
        @for (part of summary(); track $index) {
          @if (part.strong) {
            <strong>{{ part.text }}</strong>
          } @else {
            {{ part.text }}
          }
        }
      </p>
      @if (aiNote(); as note) {
        <span class="text-[13px] text-muted whitespace-nowrap">{{ note }}</span>
      }
    </div>
  }

  @if (layout() === "tabs") {
    <div role="tablist" aria-label="Search method" class="flex bg-surface">
      <button
        type="button"
        role="tab"
        class="btn interactive flex-1"
        [class]="activeSide() === 'keyword' ? 'btn-primary' : 'text-muted hover:text-ink'"
        [attr.aria-selected]="activeSide() === 'keyword'"
        (click)="activeSide.set('keyword')"
      >
        Keyword ({{ keywordProducts().length }})
      </button>
      <button
        type="button"
        role="tab"
        class="btn interactive flex-1"
        [class]="activeSide() === 'ai' ? 'btn-primary' : 'text-muted hover:text-ink'"
        [attr.aria-selected]="activeSide() === 'ai'"
        (click)="activeSide.set('ai')"
      >
        AI ({{ aiLoading() ? "…" : aiProducts().length }})
      </button>
    </div>
  }

  <div class="flex gap-6" [class.flex-col]="layout() !== 'side-by-side'">
    @if (shows("keyword")) {
      <app-result-column
        class="flex-1 min-w-0"
        side="keyword"
        heading="Keyword search"
        [subheading]="['Any product with your words or their forms,', 'as most store searches do']"
        [countText]="keywordCount()"
        [aiPicks]="aiPicks()"
        [products]="keywordProducts()"
        [matches]="keywordMatches()"
        [pageSize]="pageSize"
        [hoveredId]="hoveredId()"
        [emptyText]="keywordEmpty()"
        (select)="select.emit({ id: $event, side: 'keyword' })"
        (hoverChange)="hoveredId.set($event)"
      />
    }
    @if (shows("ai")) {
      <app-result-column
        class="flex-1 min-w-0"
        [class.border-l]="layout() === 'side-by-side'"
        [class.pl-6]="layout() === 'side-by-side'"
        [class.border-t]="layout() === 'stacked'"
        [class.pt-10]="layout() === 'stacked'"
        side="ai"
        heading="AI search"
        [subheading]="['Understands meaning,', 'not just words']"
        [countText]="aiCount()"
        [products]="aiProducts()"
        [matches]="aiMatches()"
        [rankChanges]="rankChanges()"
        [pageSize]="pageSize"
        [hoveredId]="hoveredId()"
        [loading]="aiLoading()"
        emptyText="AI found nothing relevant for this query."
        tourTarget="first-ai-result"
        (select)="select.emit({ id: $event, side: 'ai' })"
        (hoverChange)="hoveredId.set($event)"
      />
    }
  </div>
</section>
