<button
  type="button"
  (click)="onSelect()"
  class="product-tile bg-surface flex flex-col text-left w-full h-full cursor-pointer border border-transparent hover:border-transparent hover:[border-image:var(--gradient-brand)_1] hover:-translate-y-0.5 transition-all"
>
  <div class="relative bg-white flex items-center justify-center p-2 h-32 lg:h-28">
    @if (imageUrl() && !imageFailed()) {
      <img
        [src]="imageUrl()"
        [alt]="product().title"
        loading="lazy"
        decoding="async"
        (error)="imageFailed.set(true)"
        class="max-h-full max-w-full object-contain"
      />
    } @else {
      <span class="text-xs text-body">No image</span>
    }
  </div>
  <div class="flex-1 min-w-0 flex flex-col px-3 py-2.5">
    @if (matchInfo(); as info) {
      <span class="self-start mb-1 text-[9px] font-bold uppercase tracking-wide bg-highlight text-ink px-1.5 py-0.5">
        AI match · {{ matchCount(info) }} {{ wordFormMatches(matchCount(info)) }}
      </span>
    }
    <p class="text-[10px] font-bold uppercase tracking-wide text-gradient-brand mb-0.5">{{ product().category }}</p>
    <h3 class="font-extrabold leading-snug line-clamp-2 text-xs min-h-8 mb-0.5">
      {{ product().title }}
    </h3>
    <p class="text-[11px] text-body line-clamp-1 mb-1.5">{{ product().store }}</p>
    <div class="flex items-center justify-between gap-2 pt-1.5 border-t border-line mt-auto">
      <span class="font-extrabold text-sm">{{ formatPrice(product().price) }}</span>
      <span class="flex items-center gap-1 text-[11px] font-bold text-body whitespace-nowrap">
        <app-icon name="star" [size]="12" class="text-brand-dark" />
        {{ formatRating(product().averageRating) }} · {{ product().ratingCount }}
      </span>
    </div>
  </div>
</button>
