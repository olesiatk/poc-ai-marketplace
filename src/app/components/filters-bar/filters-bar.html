<section class="mx-auto max-w-7xl px-4 sm:px-8 pt-1 pb-1" data-tour="filters-bar">
  <div class="bg-surface px-4 py-3 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-x-4 gap-y-3 items-end">
    <app-filter-select
      [id]="'f-category'"
      label="Category"
      [value]="filters().categories"
      [options]="options().categories"
      placeholder="All categories"
      [fromQuery]="fromQuery().has('categories')"
      (valueChange)="onSelectChange('categories', $event)"
    />
    <app-filter-select
      [id]="'f-item-form'"
      label="Item form"
      [value]="filters().itemForms"
      [options]="options().itemForms"
      placeholder="All forms"
      [fromQuery]="fromQuery().has('itemForms')"
      (valueChange)="onSelectChange('itemForms', $event)"
    />
    <app-rating-select [id]="'f-rating'" [value]="filters().minRating" (valueChange)="onRatingChange($event)" />
    <div>
      <label for="f-price" class="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wide mb-1">
        Max price, $
        @if (fromQuery().has("maxPrice")) {
          <span class="query-tag">from your query</span>
        }
      </label>
      <input
        id="f-price"
        type="range"
        [min]="0"
        [max]="priceLimit()"
        [step]="1"
        [value]="filters().maxPrice"
        (input)="onPriceChange($event)"
        class="w-full"
      />
      <output class="block mt-0.5 text-xs font-bold text-gradient-brand">{{ formatPrice(filters().maxPrice) }}</output>
    </div>
    <div>
      <button
        type="button"
        (click)="reset.emit()"
        class="cta-label cta-label--compact border-1 text-ink font-bold uppercase text-xs tracking-wide hover:bg-ink hover:text-white transition-colors"
      >
        Reset all
      </button>
    </div>
  </div>
</section>
