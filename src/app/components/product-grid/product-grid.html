<section class="flex flex-col gap-6" data-tour="product-grid">
  <div class="flex items-baseline justify-between flex-wrap gap-2">
    <h2 class="display text-2xl">{{ title() }}</h2>
    <span class="text-muted">Open a product to see details and reviews</span>
  </div>

  @if (products().length === 0) {
    <div class="border border-line px-6 py-10 flex flex-col items-center gap-4 text-center">
      <strong class="display text-xl">No products match these filters</strong>
      <button type="button" class="btn btn-secondary interactive" (click)="resetFilters.emit()">Reset filters</button>
    </div>
  } @else {
    <div class="grid gap-4" [style.grid-template-columns]="'repeat(' + columns() + ', minmax(0, 1fr))'">
      @for (product of visibleProducts(); track product.id) {
        <app-product-row [product]="product" [attr.data-tour]="$index === 0 ? 'first-product-card' : null" (select)="select.emit($event)" />
      }
    </div>
    @if (totalPages() > 1) {
      <app-pager [page]="currentPage()" [total]="totalPages()" (pageChange)="goToPage($event)" />
    }
  }
</section>
