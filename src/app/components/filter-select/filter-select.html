<button
  type="button"
  [id]="id()"
  class="dropdown-trigger interactive"
  [attr.aria-label]="label() + ': ' + summary()"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-controls]="id() + '-menu'"
  (click)="toggleOpen()"
>
  <span class="truncate">{{ summary() }}</span>
  <span class="flex transition-transform" [class.rotate-180]="isOpen()"><app-icon name="chevron-down" [size]="24" /></span>
</button>

@if (isOpen()) {
  <div class="dropdown-menu" [id]="id() + '-menu'" role="group" [attr.aria-label]="label()">
    @for (opt of options(); track opt) {
      <label class="check-row min-h-10 px-3.5">
        <input type="checkbox" [checked]="isSelected(opt)" (change)="toggle(opt)" />
        <span class="check-box">
          <svg class="check-box__mark" width="14" height="14" viewBox="5 5 14 14" fill="none" aria-hidden="true">
            <path d="M8 11.7727L10.8235 14.5L16 9.5" stroke="#fff" stroke-width="2" />
          </svg>
        </span>
        {{ opt }}
      </label>
    }
  </div>
}
