<div class="relative">
  <label [for]="id()" class="block text-[10px] font-bold uppercase tracking-wide mb-1">{{ label() }}</label>

  <div class="relative">
    <input
      [id]="id()"
      type="text"
      role="combobox"
      aria-haspopup="listbox"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-controls]="id() + '-listbox'"
      autocomplete="off"
      [value]="isOpen() ? query() : value()"
      [placeholder]="value() || placeholder()"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (keydown.escape)="onEscape()"
      class="w-full pl-2.5 pr-8 py-1.5 border border-ink text-[13px] bg-white text-ink placeholder:text-ink outline-none focus:border-brand-dark"
    />
    <span class="absolute right-2.5 top-1/2 -translate-y-1/2 flex text-ink pointer-events-none">
      <app-icon name="chevron-down" [size]="14" />
    </span>
  </div>

  @if (isOpen()) {
    <ul
      [id]="id() + '-listbox'"
      role="listbox"
      (scroll)="onScroll($event)"
      class="absolute top-full left-0 right-0 mt-1 bg-white shadow-xl z-20 max-h-56 overflow-y-auto"
    >
      <li role="option" [attr.aria-selected]="!value()">
        <button
          type="button"
          (mousedown)="$event.preventDefault()"
          (click)="select('')"
          class="w-full text-left px-3 py-2 text-[13px] hover:bg-surface transition-colors"
          [class.font-bold]="!value()"
        >
          {{ placeholder() }}
        </button>
      </li>
      @for (opt of visibleOptions(); track opt) {
        <li role="option" [attr.aria-selected]="opt === value()">
          <button
            type="button"
            (mousedown)="$event.preventDefault()"
            (click)="select(opt)"
            class="w-full text-left px-3 py-2 text-[13px] hover:bg-surface transition-colors"
            [class.font-bold]="opt === value()"
          >
            {{ opt }}
          </button>
        </li>
      }
      @if (visibleOptions().length === 0) {
        <li class="px-3 py-2 text-[13px] text-body">No matches</li>
      }
    </ul>
  }
</div>
